# WAF 规则 — 在 http 块内 include

geo $waf_blocked_ip {
    default 0;
    include /etc/nginx/waf-blocks.conf;
}

map $http_user_agent $waf_blocked_agent {
    default 0;
    ~*(?i)sqlmap 1;
    ~*(?i)nikto 1;
    ~*(?i)nmap 1;
    ~*(?i)masscan 1;
    ~*(?i)dirbuster 1;
    ~*(?i)hydra 1;
    ~*(?i)acunetix 1;
    "" 1;
}

map $request_uri $waf_blocked_uri {
    default 0;
    ~*(?i)(union.*select|<script|\.\./|/etc/passwd|eval\() 1;
}
