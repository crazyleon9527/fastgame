# Brotli 优先，gzip 回退 — 较纯 gzip 节省 15%~25% 体积
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain text/css text/javascript application/javascript
    application/json application/wasm application/xml
    image/svg+xml;

brotli on;
brotli_comp_level 6;
brotli_min_length 256;
brotli_types
    text/plain text/css text/javascript application/javascript
    application/json application/wasm application/xml
    image/svg+xml;

# 配合 client/scripts/compress-brotli.sh 生成的 .br 文件
brotli_static on;
gzip_static on;
