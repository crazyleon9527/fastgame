worker_processes auto;

events {
    worker_connections 2048;
}

http {
    log_format main '$remote_addr - $request [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_x_trace_id"';

    access_log /var/log/nginx/access.log main;
    sendfile on;

    # CC / DDoS 第一层防护：按 IP 限流
    limit_req_zone $binary_remote_addr zone=game_api:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=game_bet:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=admin_api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    include /etc/nginx/waf.conf;

    upstream rgs_api {
        server host.docker.internal:18888;
        keepalive 32;
    }

    upstream admin_api {
        server host.docker.internal:18889;
        keepalive 16;
    }

    upstream broadcast_ws {
        server host.docker.internal:18900;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Trace-Id $request_id;

        limit_conn conn_per_ip 50;

        if ($waf_blocked_ip) { return 403; }
        if ($waf_blocked_agent) { return 403; }
        if ($waf_blocked_uri) { return 403; }

        location /api/v1/game/bet {
            limit_req zone=game_bet burst=8 nodelay;
            client_max_body_size 64k;
            proxy_pass http://rgs_api;
        }

        location /api/v1/game/ {
            limit_req zone=game_api burst=20 nodelay;
            proxy_pass http://rgs_api;
        }

        location /api/v1/admin/ {
            limit_req zone=admin_api burst=15 nodelay;
            proxy_pass http://admin_api;
        }

        location /admin/ {
            alias /usr/share/nginx/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        location = /admin {
            return 301 /admin/;
        }

        location /ws/ {
            proxy_pass http://broadcast_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}
