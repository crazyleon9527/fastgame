load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    log_format main '$remote_addr - $request [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_x_trace_id"';

    access_log /var/log/nginx/access.log main;
    sendfile on;

    include /etc/nginx/cloudflare-realip.conf;
    include /etc/nginx/origin-shield.conf;

    map $http_x_trace_id $trace_id {
        default $http_x_trace_id;
        ''      $request_id;
    }

    # CC / DDoS 第一层防护：按真实客户端 IP 限流 (Cloudflare 回源后)
    limit_req_zone $binary_remote_addr zone=game_api:20m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=game_bet:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=admin_api:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    include /etc/nginx/waf.conf;
    include /etc/nginx/merchant-whitelist.conf;
    include /etc/nginx/compression.conf;

    upstream rgs_api {
        server host.docker.internal:18888;
        keepalive 32;
    }

    upstream admin_api {
        server host.docker.internal:18889;
        keepalive 16;
    }

    upstream broadcast_ws {
        server host.docker.internal:18900;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Trace-Id $trace_id;
        add_header X-Trace-Id $trace_id always;

        limit_conn conn_per_ip 50;

        # 源站隐匿：非 Cloudflare 回源 IP 直接断开 (生产 origin-shield.prod.conf)
        if ($origin_shield_allowed = 0) { return 444; }

        if ($waf_blocked_ip) { return 403; }
        if ($waf_blocked_agent) { return 403; }
        if ($waf_blocked_uri) { return 403; }

        location /api/v1/game/bet {
            if ($merchant_gateway_allowed = 0) { return 444; }
            limit_req zone=game_bet burst=8 nodelay;
            client_max_body_size 64k;
            proxy_pass http://rgs_api;
        }

        location /api/v1/game/ {
            if ($merchant_gateway_allowed = 0) { return 444; }
            limit_req zone=game_api burst=20 nodelay;
            proxy_pass http://rgs_api;
        }

        location /api/v1/admin/ {
            limit_req zone=admin_api burst=15 nodelay;
            proxy_pass http://admin_api;
        }

        location /admin/ {
            alias /usr/share/nginx/admin/;
            index index.html;
            try_files $uri $uri/ /admin/index.html;
        }

        location = /admin {
            return 301 /admin/;
        }

        location /verify/ {
            alias /usr/share/nginx/verify/;
            index index.html;
        }

        location = /verify {
            return 301 /verify/;
        }

        location /replay/ {
            alias /usr/share/nginx/replay/;
            index index.html;
        }

        location = /replay {
            return 301 /replay/;
        }

        # Cocos WebGL H5 游戏客户端（Brotli 静态预压缩，见 compression.conf）
        location /game/ {
            alias /usr/share/nginx/game/;
            index index.html;
        }

        location = /game {
            return 301 /game/;
        }

        location /api/v1/game/replay/ {
            limit_req zone=game_api burst=20 nodelay;
            proxy_pass http://rgs_api;
        }

        location /ws/ {
            proxy_pass http://broadcast_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}
