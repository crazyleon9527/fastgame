worker_processes auto;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $request [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_x_trace_id"';

    access_log /var/log/nginx/access.log main;
    sendfile on;

    upstream rgs_api {
        server host.docker.internal:18888;
    }

    upstream admin_api {
        server host.docker.internal:18889;
    }

    upstream broadcast_ws {
        server host.docker.internal:18900;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Trace-Id $request_id;

        location /api/v1/game/ {
            proxy_pass http://rgs_api;
        }

        location /api/v1/admin/ {
            proxy_pass http://admin_api;
        }

        location /ws/ {
            proxy_pass http://broadcast_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }
    }
}
