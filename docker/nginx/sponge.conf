# Sponge 管理后台 — 独立 server_name + 运维 IP 白名单
server {
    listen 80;
    # 只接这两个精确名，不包含 localhost/127.0.0.1：
    # 若包含，nginx 会因本块先出现而抢走 localhost 的默认匹配，
    # 导致主 server（/health、/verify/、/replay/、/api/v1/game/*）全部 404。
    # 本地访问后台请在 hosts 里把 sponge.localhost 指向 127.0.0.1
    # （Windows 默认把 *.localhost 解析到 ::1，而 Docker Desktop 的 IPv6
    #  端口转发不可用，请求到不了 nginx，会看到 502）。
    server_name sponge.localhost ops.fastgame.internal;

    # admin-ip-whitelist.conf 已在 nginx.conf http 块加载，此处直接使用 $admin_ip_allowed
    if ($admin_ip_allowed = 0) { return 444; }

    set $trace_id $http_x_trace_id;
    if ($trace_id = "") { set $trace_id $request_id; }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Trace-Id $trace_id;
    add_header X-Trace-Id $trace_id always;

    limit_req zone=admin_api burst=15 nodelay;

    location /api/v1/admin/ {
        # 固定用宿主机 IPv4 网关地址，不用 host.docker.internal：
        # 后者在容器内同时解析出 IPv6（fdc4:f303:9324::254），当请求经 IPv6 进入
        # nginx 时上游会连到该 IPv6 地址，而 Windows 上它不可达 → 502。
        # 该地址即 Docker Desktop 的 host-gateway（可用 `ipconfig` 的 vEthernet(WSL) 核对）。
        set $upstream_admin 192.168.65.254:18889;
        proxy_pass http://$upstream_admin;
    }

    location /admin/uploads/ {
        alias /usr/share/nginx/admin/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /admin/ {
        alias /usr/share/nginx/admin/;
        index index.html;
    }

    location = / {
        return 301 /admin/;
    }
}
