services:
  mysql:
    image: mysql:8.0
    container_name: fastgame-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-fastgame_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fastgame}
      MYSQL_USER: ${MYSQL_USER:-fastgame}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fastgame_pass}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --max_connections=500
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-fastgame_root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - fastgame

  redis:
    image: redis:7-alpine
    container_name: fastgame-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-16379}:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - fastgame

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: fastgame-clickhouse
    restart: unless-stopped
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-18123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-19000}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-fastgame}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-fastgame}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-fastgame_pass}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      TZ: UTC
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - fastgame

  kafka:
    image: apache/kafka:3.8.1
    container_name: fastgame-kafka
    hostname: kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-19092}:9092"
    environment:
      CLUSTER_ID: fastgame-kafka-cluster-01
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_COMPRESSION_TYPE: snappy
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:29092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - fastgame

  kafka-init:
    image: apache/kafka:3.8.1
    container_name: fastgame-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/init-topics.sh"]
    volumes:
      - ./docker/kafka/init-topics.sh:/scripts/init-topics.sh:ro
    restart: on-failure
    networks:
      - fastgame

  clickhouse-init:
    image: clickhouse/clickhouse-server:24.8
    container_name: fastgame-clickhouse-init
    depends_on:
      clickhouse:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/init-db.sh"]
    volumes:
      - ./docker/clickhouse/init-db.sh:/scripts/init-db.sh:ro
      - ./docker/clickhouse/init/01-init.sql:/scripts/01-init.sql:ro
      - ./docker/clickhouse/init/02-trace-migration.sql:/scripts/02-trace-migration.sql:ro
      - ./docker/clickhouse/init/03-money-migration.sql:/scripts/03-money-migration.sql:ro
    restart: on-failure
    networks:
      - fastgame

  kafka-ui:
    profiles:
      - dev-tools
    image: provectuslabs/kafka-ui:latest
    container_name: fastgame-kafka-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-18080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fastgame-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - fastgame

  adminer:
    profiles:
      - dev-tools
    image: adminer:4
    container_name: fastgame-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ADMINER_PORT:-18081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fastgame

  # phpMyAdmin — MySQL 图形化面板 (SQL 编辑器 / 表结构 / 导入导出)
  phpmyadmin:
    profiles:
      - dev-tools
    image: phpmyadmin:5
    container_name: fastgame-phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-18082}:80"
    environment:
      # 主机/端口由环境变量写死，登录页不再要求填写服务器（PMA_ARBITRARY 会
      # 多出一个"服务器"输入框，且默认值 127.0.0.1 在容器内指向容器自身，会连不上）
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 256M
      MEMORY_LIMIT: 512M
      # 空密码登录在本地开发面板上没必要放开，默认关闭更安全
      PMA_ALLOW_NO_PASSWORD: 0
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fastgame

  # CH-UI — ClickHouse 图形化面板 (SQL 编辑器 / 库表浏览 / 图表)
  # 首次登录用 ClickHouse 账号: fastgame / fastgame_pass
  ch-ui:
    profiles:
      - dev-tools
    image: ghcr.io/caioricciuti/ch-ui:latest
    container_name: fastgame-ch-ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CH_UI_PORT:-18124}:3488"
    environment:
      PORT: 3488
      CLICKHOUSE_URL: http://clickhouse:8123
      CONNECTION_NAME: FastGame ClickHouse
      DATABASE_PATH: /app/data/ch-ui.db
      APP_SECRET_KEY: ${CH_UI_SECRET:-fastgame-ch-ui-dev-secret}
    volumes:
      - ch_ui_data:/app/data
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - fastgame

  gateway:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    image: fastgame-gateway:brotli
    container_name: fastgame-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-18000}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/compression.conf:/etc/nginx/compression.conf:ro
      - ./docker/nginx/admin-ip-whitelist.conf:/etc/nginx/admin-ip-whitelist.conf:ro
      - ./docker/nginx/sponge.conf:/etc/nginx/sponge.conf:ro
      - ./docker/nginx/cloudflare-realip.conf:/etc/nginx/cloudflare-realip.conf:ro
      - ./docker/nginx/origin-shield.conf:/etc/nginx/origin-shield.conf:ro
      - ./docker/nginx/waf.conf:/etc/nginx/waf.conf:ro
      - ./docker/nginx/waf-blocks.conf:/etc/nginx/waf-blocks.conf:ro
      - ./docker/nginx/merchant-whitelist.conf:/etc/nginx/merchant-whitelist.conf:ro
      - ./web/admin:/usr/share/nginx/admin:ro
      - ./web/admin/uploads:/usr/share/nginx/admin/uploads:ro
      - ./web/shared:/usr/share/nginx/shared:ro
      - ./web/verify:/usr/share/nginx/verify:ro
      - ./web/replay:/usr/share/nginx/replay:ro
      - ./web/game:/usr/share/nginx/game:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - fastgame

  redisinsight:
    profiles:
      - dev-tools
    image: redis/redisinsight:latest
    container_name: fastgame-redisinsight
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_INSIGHT_PORT:-15540}:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fastgame

volumes:
  mysql_data:
  redis_data:
  clickhouse_data:
  kafka_data:
  redisinsight_data:
  ch_ui_data:

networks:
  fastgame:
    driver: bridge
