Log:
  ServiceName: consumer
  Mode: console
  Level: info
  Encoding: plain

Kafka:
  Brokers:
    - localhost:19092
  GroupID: fastgame-settle-consumer
  Topic: game.round.settled

ClickHouse:
  Addr: localhost:19000
  Database: fastgame
  User: fastgame
  Password: fastgame_pass

MySQL:
  DataSource: fastgame:fastgame_pass@tcp(localhost:13306)/fastgame?charset=utf8mb4&parseTime=true&loc=UTC

Redis:
  Addr: localhost:16379

RtpWatch:
  Enabled: true
  UseRedis: true
  GlobalMax: 10000
  # 窗口必须不小于 MinSamples，否则该维度永远不会告警（启动时会自动抬高并打日志）
  PlayerMax: 2000
  ThresholdPPM: 1800000
  # 触发告警所需的最少局数。本游戏单局派彩 σ≈6 倍投注额（最高 500x），
  # 10 局窗口里一个 20x 就能把窗口 RTP 推到 180% 阈值以上，
  # 于是正常波动被误判成 RTP 漂移 → flagged 游戏 + 封禁玩家 + 全部下注 403。
  # 2000 是按 6σ 上界推导出的下限（详见 pkg/rtpwatchdog.Config.MinSamples）。
  MinSamples: 2000
  # 同一对象两次告警的最小间隔，避免窗口越线后逐局刷屏
  AlertCooldown: 10m

Batch:
  MaxSize: 2000
  Interval: 1s
