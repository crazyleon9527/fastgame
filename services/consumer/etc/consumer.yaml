Log:
  ServiceName: consumer
  Mode: console
  Level: info
  Encoding: plain

Kafka:
  Brokers:
    - localhost:19092
  GroupID: fastgame-settle-consumer
  Topic: game.round.settled

ClickHouse:
  Addr: localhost:19000
  Database: fastgame
  User: fastgame
  Password: fastgame_pass

MySQL:
  DataSource: fastgame:fastgame_pass@tcp(localhost:13306)/fastgame?charset=utf8mb4&parseTime=true&loc=UTC

Redis:
  Addr: localhost:16379

RtpWatch:
  Enabled: true
  UseRedis: true
  GlobalMax: 10000
  PlayerMax: 200
  ThresholdPPM: 1800000

Batch:
  MaxSize: 2000
  Interval: 1s
