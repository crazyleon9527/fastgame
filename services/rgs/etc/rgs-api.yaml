Name: rgs-api
Host: 0.0.0.0
Port: 18888
Timeout: 30000
MaxBytes: 1048576

Log:
  ServiceName: rgs-api
  Mode: file             # file 模式写入本地
  Path: logs/rgs-api     # 隔离为子目录！各服务互不影响，如 logs/admin-api, logs/consumer
  Level: info
  Compress: true         # 历史日志自动 gzip 压缩 (生成如 error.2026-09-19.gz)
  KeepDays: 7            # 日志自动保留 7 天，过期自动清理
  StackCooldownMillis: 100
  Rotation: daily        # daily 每天定时切分 (或 size 按大小切分)

MySQL:
  DataSource: fastgame:fastgame_pass@tcp(localhost:13306)/fastgame?charset=utf8mb4&parseTime=true&loc=UTC

Redis:
  Addr: localhost:16379

Kafka:
  Brokers:
    - localhost:19092

CH:
  Addr: localhost:19000
  Database: fastgame
  User: fastgame
  Password: fastgame_pass

Wallet:
  Mock: true
  BaseURL: "http://127.0.0.1:8089"
  APIKey: "test_key"
  SignSecret: dev-wallet-hmac-secret
  SignEnabled: false
  VerifyResponse: false
  ResponseTimestampSec: 60
  Timeout: 5s
  SlowThresholdMs: 500

Game:
  DefaultRtpTier: default

Security:
  SkipMerchantSign: true
  SkipSessionEnvelope: true
  # 必填：config.SecurityConf.MerchantKeyCipher 无 optional 标签，缺失会导致启动直接失败。
  # 用于解密 merchants.private_key，须与 admin-api.yaml 一致；生产用 .prod.yaml 覆盖。
  MerchantKeyCipher: fastgame-dev-cipher-change-me-in-prod
  TimestampWindowSec: 60
  MaxClockSkewSec: 5
  UserLimitPerSec: 5
  IPLimitPerSec: 20
  MinResponseDelayMs: 150

Session:
  TTLHours: 24
