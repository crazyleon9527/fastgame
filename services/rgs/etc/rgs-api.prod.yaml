Name: rgs-api
Host: 127.0.0.1
Port: 18888
Timeout: 30000
MaxBytes: 1048576

Log:
  Mode: file
  Level: info

MySQL:
  DataSource: fastgame:CHANGE_ME@tcp(127.0.0.1:3306)/fastgame?charset=utf8mb4&parseTime=true&loc=UTC

Redis:
  Addr: 127.0.0.1:6379

Kafka:
  Brokers:
    - 127.0.0.1:9092

Wallet:
  Mock: false
  BaseURL: "https://wallet.example.com"
  APIKey: ""
  SignSecret: CHANGE_ME
  SignEnabled: true
  VerifyResponse: true
  ResponseTimestampSec: 60
  Timeout: 5s

Game:
  DefaultRtpTier: default

Security:
  SkipMerchantSign: false
  SkipSessionEnvelope: false
  TimestampWindowSec: 60
  MaxClockSkewSec: 5
  UserLimitPerSec: 5
  IPLimitPerSec: 20
  MinResponseDelayMs: 150

Session:
  TTLHours: 24
