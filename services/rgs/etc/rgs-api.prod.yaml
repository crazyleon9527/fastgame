Name: rgs-api
Host: 127.0.0.1
Port: 18888
Timeout: 30000
MaxBytes: 1048576

Log:
  ServiceName: rgs-api
  Mode: file             # file 模式写入本地
  Path: logs/rgs-api     # 隔离为子目录！各服务互不影响，如 logs/admin-api, logs/consumer
  Level: info
  Compress: true         # 历史日志自动 gzip 压缩 (生成如 error.2026-09-19.gz)
  KeepDays: 7            # 日志自动保留 7 天，过期自动清理
  StackCooldownMillis: 100
  Rotation: daily        # daily 每天定时切分 (或 size 按大小切分)

MySQL:
  DataSource: fastgame:CHANGE_ME@tcp(mysql.internal:3306)/fastgame?charset=utf8mb4&parseTime=true&loc=UTC

Redis:
  Addr: redis.internal:6379

Kafka:
  Brokers:
    - kafka.internal:9092

CH:
  Addr: clickhouse.internal:9000
  Database: fastgame
  User: fastgame
  Password: CHANGE_ME

Wallet:
  Mock: false
  BaseURL: "https://wallet.example.com"
  APIKey: ""
  SignSecret: CHANGE_ME
  SignEnabled: true
  VerifyResponse: true
  ResponseTimestampSec: 60
  Timeout: 5s

Game:
  DefaultRtpTier: default

Security:
  SkipMerchantSign: false
  SkipSessionEnvelope: false
  MerchantKeyCipher: CHANGE_ME_MERCHANT_KEY_CIPHER
  TimestampWindowSec: 60
  MaxClockSkewSec: 5
  UserLimitPerSec: 5
  IPLimitPerSec: 20
  MinResponseDelayMs: 150

Session:
  TTLHours: 24
